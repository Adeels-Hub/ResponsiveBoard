<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test /geoenrich Endpoint</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    input, button { padding: 0.5rem; margin: 0.5rem 0; width: 100%; }
    textarea { width: 100%; height: 150px; margin-top: 1rem; }
  </style>
</head>
<body>

  <h1>Test /geoenrich API</h1>

  <label for="geo-url">Geoenrich Worker URL:</label>
  <input type="text" id="geo-url" placeholder="https://geoenrich.vividcanvasandprints.workers.dev", value="https://geoenrich.vividcanvasandprints.workers.dev">

  <label for="ip">IP Address:</label>
  <input type="text" id="ip" placeholder="Example: 8.8.8.8" value="115.128.61.98">

  <label for="visitorKey">Visitor Log Key:</label>
  <input type="text" id="visitorKey" placeholder="Example: log_8.8.8.8_/products/shirt_xyz123", value="log_115.128.61.98_/_Mozilla/5.0-(Windows-NT-10.0;-Wi_5819408">

  <button id="send">Send Enrich Request</button>

  <h2>Response:</h2>
  <textarea id="response" readonly></textarea>

  <script>
    document.getElementById('send').addEventListener('click', async () => {
      const url = document.getElementById('geo-url').value.trim();
	  alert('after get:' + url);
      const ip = document.getElementById('ip').value.trim();
      const visitorKey = document.getElementById('visitorKey').value.trim();
      const responseBox = document.getElementById('response');

      if (!url || !ip || !visitorKey) {
        responseBox.value = "⚠️ Please fill all fields.";
        return;
      }

      try {
	  alert(url);
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ip, visitorLogKey: visitorKey })
        });

        const text = await res.text();
        responseBox.value = `Status: ${res.status}\n\n${text}`;
      } catch (err) {
        responseBox.value = `❌ Error: ${err.message}`;
      }
    });
  </script>

</body>
</html>
